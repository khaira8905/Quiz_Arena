# Render Blueprint for the QuizArena game server (free instance).
# The database is external (Neon free plan) and the Next.js frontend deploys to Vercel
# separately — see docs/DEPLOYMENT.md.
#
# Free instances sleep after ~15 minutes without traffic and take up to a minute to wake.
# Open the site a few minutes before an event; switch `plan` to `starter` for always-on.
services:
  - type: web
    name: quizarena-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when Render asks
      - key: WEB_ORIGIN
        sync: false # e.g. https://quiz-arena.vercel.app
      - key: ALLOW_REGISTRATION
        sync: false # set to true only while creating the first admin
